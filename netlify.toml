# Netlify configuration for TRAVELENS React SPA
# Project repository: https://github.com/Tejas190605/travelens-tourism-review-analyzer

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA fallback rule for React Router (ensures direct URL reloads work)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production security and asset caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
