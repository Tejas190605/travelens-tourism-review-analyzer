services:
  # -------------------------------------------------------------
  # 1. TRAVELENS Backend Web Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: travelens-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./travelens.db

  # -------------------------------------------------------------
  # 2. TRAVELENS Frontend Static Site (React 18 / Vite)
  # -------------------------------------------------------------
  - type: web
    name: travelens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: travelens-backend
          property: host
